<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OfertasVip — Central de Ofertas</title>
  <meta name="description" content="As melhores promoções atualizadas automaticamente." />
  <style>
    :root { --accent:#0b72ff; --bg:#fafafa; --card-bg:#fff; --muted:#666; --border:#e6e6e6; }
    body { margin:0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: #fff; color:#111; }
    header { background: #ffea3d; padding:14px 18px; display:flex; align-items:center; gap:12px; }
    header img { height:34px; }
    header h1 { margin:0; font-size:18px; color:#111; }
    main { padding:18px; max-width:1200px; margin:0 auto; }
    .hero { margin-bottom:12px; }
    .hero h2 { margin:6px 0 0; font-size:20px; }
    .hero p { margin:6px 0 0; color:var(--muted); }
    #offers-area { padding:12px 0; min-height:220px; display:flex; align-items:center; justify-content:center; }
    #offers-list { display:flex; flex-wrap:wrap; gap:12px; justify-content:flex-start; align-items:flex-start; }
    .card { border:1px solid var(--border); border-radius:6px; padding:10px; width:240px; background:var(--card-bg); box-sizing:border-box; }
    .card img { width:100%; height:150px; object-fit:contain; background:#f7f7f7; display:block; }
    .card h3 { font-size:14px; margin:8px 0 4px; min-height:38px; color:#111; }
    .card .price { font-weight:700; color:#222; margin-bottom:6px;}
    .card p { font-size:12px; color:var(--muted); min-height:36px; margin:0 0 8px; }
    .card a { display:inline-block; padding:8px 10px; background:var(--accent); color:#fff; border-radius:4px; text-decoration:none; font-size:13px; }
    .admin { margin-top:18px; display:flex; gap:8px; flex-wrap:wrap; }
    .btn { padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:#fff; cursor:pointer; }
    .muted { color:var(--muted); font-size:13px; }
    #injected-offers-wrapper { width:100%; }
    @media (max-width:600px){ .card{ width:46%; } }
  </style>
</head>
<body>
  <header>
    <!-- Logo (substitua se tiver logo real) -->
    <img src="https://via.placeholder.com/120x34?text=logo" alt="logo">
    <div>
      <h1>OfertasVip</h1>
      <div class="muted">Central de Ofertas</div>
    </div>
  </header>

  <main>
    <section class="hero">
      <h2>As melhores promoções atualizadas automaticamente.</h2>
      <p class="muted">Os melhores descontos com seus links de afiliado.</p>
    </section>

    <!-- Área que o script detecta e substitui -->
    <section id="offers-area">
      <div id="offers-placeholder" class="muted">Nenhuma oferta encontrada.</div>
    </section>

    <div class="admin" aria-label="Painel Admin">
      <button class="btn" id="save-local">Salvar (Local)</button>
      <button class="btn" id="export-json">Exportar JSON</button>
      <button class="btn" id="clear-local">Limpar Local</button>
      <div style="flex:1"></div>
      <a class="btn" href="#" id="link-whatsapp">WhatsApp</a>
      <a class="btn" href="#" id="link-telegram">Telegram</a>
    </div>

    <div style="margin-top:24px;" class="muted">Ofertas locais</div>
  </main>

  <!-- Auto-load and render offers from /data/offers.json (cache-bust, compatibility, safe render) -->
  <script>
  (async function renderOffersFromData(){
    try {
      // cache-bust para evitar CDN/edge cache
      const url = '/data/offers.json?t=' + Date.now();
      const resp = await fetch(url, { cache: 'no-cache' });
      if (!resp.ok) {
        console.warn('offers.json não disponível (status ' + resp.status + ')');
        return;
      }
      const arr = await resp.json();
      if (!arr || (Array.isArray(arr) && arr.length === 0)) return;

      // grava nas chaves para máxima compatibilidade
      const chaves = ['offers','ofertas','offersLocal','ofertasLocal','localOffers','data','products','items','minhas_ofertas','site_offers','site_offers_v1'];
      chaves.forEach(k => {
        try { localStorage.setItem(k, JSON.stringify(arr)); } catch(e){}
      });

      // adiciona timestamp para debug/cache
      try { localStorage.setItem('offers_last_updated', new Date().toISOString()); } catch(e){}

      // notifica apps que escutam mudanças
      window.dispatchEvent(new Event('offers-updated'));

      // container específico onde as ofertas devem aparecer
      const offersArea = document.getElementById('offers-area');
      if (!offersArea) return;

      // remove wrapper anterior se existir
      const prev = document.getElementById('injected-offers-wrapper');
      if (prev && prev.parentNode) prev.parentNode.removeChild(prev);

      // limita a quantidade de itens para evitar sobrecarregar a página
      const maxItems = 60;
      const list = Array.isArray(arr) ? arr.slice(0, maxItems) : (arr.offers || []);

      // função simples de sanitização
      const sanitize = s => (s||'').toString().replace(/</g,'&lt;').replace(/>/g,'&gt;');

      // monta wrapper e cards
      const wrapper = document.createElement('div');
      wrapper.id = 'injected-offers-wrapper';
      wrapper.style.display = 'flex';
      wrapper.style.flexWrap = 'wrap';
      wrapper.style.gap = '12px';
      wrapper.style.padding = '16px';
      wrapper.style.background = 'var(--bg)';

      wrapper.innerHTML = list.map(o=>{
        const title = sanitize(o.title || o.name || o['título'] || o.nome || 'Sem título');
        const desc  = sanitize(o.description || o['descrição'] || '');
        const img   = sanitize(o.image_url || o.imagem_url || o.imagemProduto || '');
        const link  = sanitize(o.affiliate_link || o.link_de_afiliado || o.urlAfiliado || '#');
        const priceNum = (o.price_number || o['número_do_preço']);
        const priceText = sanitize(o.price || o.price_text || o['preço'] || '');
        const priceHtml = (priceNum || priceNum === 0) ? ('R$ ' + Number(priceNum).toLocaleString('pt-BR',{minimumFractionDigits:2})) : priceText;
        return `<div class="card" role="article" aria-label="${title}">
          <div style="width:100%;height:150px;display:flex;align-items:center;justify-content:center;background:#f8f8f8;">
            <img src="${img}" alt="${title}" loading="lazy">
          </div>
          <h3>${title}</h3>
          <div class="price">${priceHtml}</div>
          <p>${desc}</p>
          <a href="${link}" target="_blank" rel="noopener noreferrer">Ver oferta</a>
        </div>`;
      }).join('');

      // limpa placeholder e insere
      offersArea.innerHTML = '';
      offersArea.appendChild(wrapper);
      wrapper.scrollIntoView({behavior:'smooth'});

      // badge visual temporário com a hora da atualização (útil para debug)
      try {
        let badge = document.getElementById('offers-last-updated-badge');
        if (!badge) {
          badge = document.createElement('div');
          badge.id = 'offers-last-updated-badge';
          badge.style.position = 'fixed';
          badge.style.right = '12px';
          badge.style.bottom = '12px';
          badge.style.padding = '6px 10px';
          badge.style.background = 'rgba(0,0,0,0.7)';
          badge.style.color = '#fff';
          badge.style.fontSize = '12px';
          badge.style.borderRadius = '6px';
          document.body.appendChild(badge);
        }
        badge.textContent = 'Ofertas atualizadas: ' + new Date().toLocaleString();
        setTimeout(()=>{ if (badge && badge.parentNode) badge.parentNode.removeChild(badge); }, 8000);
      } catch(e){}

    } catch(e) {
      console.warn('renderOffersFromData falhou', e);
    }
  })();
  </script>

  <!-- Pequenas ações admin para o painel local (opcionais) -->
  <script>
    document.getElementById('clear-local').addEventListener('click', function(){
      const keys = Object.keys(localStorage);
      // lista de chaves que queremos limpar (mantemos outras)
      const toRemove = ['offers','ofertas','offersLocal','ofertasLocal','localOffers','data','products','items','minhas_ofertas','site_offers','site_offers_v1','offers_last_updated'];
      toRemove.forEach(k => localStorage.removeItem(k));
      alert('LocalStorage de ofertas limpo.');
      location.reload();
    });
    document.getElementById('export-json').addEventListener('click', function(){
      const data = localStorage.getItem('offers') || localStorage.getItem('ofertas') || localStorage.getItem('data') || '[]';
      const blob = new Blob([data], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'offers-export.json'; a.click();
      URL.revokeObjectURL(url);
    });
    document.getElementById('save-local').addEventListener('click', function(){
      // Faz um backup local do current offers
      const data = localStorage.getItem('offers') || localStorage.getItem('ofertas') || localStorage.getItem('data') || '[]';
      localStorage.setItem('offers_backup_' + Date.now(), data);
      alert('Backup das ofertas salvo no localStorage.');
    });
  </script>
</body>
</html>

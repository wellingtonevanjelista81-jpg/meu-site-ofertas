<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>OfertasVip — Central de Ofertas</title>
  <meta name="description" content="As melhores promoções atualizadas automaticamente." />
  <style>
    :root { --accent:#0b72ff; --bg:#fafafa; --card-bg:#fff; --muted:#666; --border:#e6e6e6; }
     { box-sizing: border-box; }
    body { margin:0; font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; background: #fff; color:#111; }
    header { background: #ffea3d; padding:14px 18px; display:flex; align-items:center; gap:12px; border-bottom:1px solid #f0d93a; }
    header img { height:34px; }
    header h1 { margin:0; font-size:18px; color:#111; }
    main { padding:18px; max-width:1200px; margin:0 auto; }
    .hero { margin-bottom:12px; }
    .hero h2 { margin:6px 0 0; font-size:20px; }
    .hero p { margin:6px 0 0; color:var(--muted); }
    #offers-area { padding:12px 0; min-height:220px; }
    #offers-placeholder { color:var(--muted); text-align:center; padding:40px 0; }
    #injected-offers-wrapper { display:flex; flex-wrap:wrap; gap:12px; justify-content:flex-start; align-items:flex-start; }
    .card { border:1px solid var(--border); border-radius:6px; padding:10px; width:240px; background:var(--card-bg); box-sizing:border-box; box-shadow: 0 2px 6px rgba(0,0,0,0.03); }
    .card img { width:100%; height:150px; object-fit:contain; background:#f7f7f7; display:block; }
    .card h3 { font-size:14px; margin:8px 0 4px; min-height:38px; color:#111; line-height:1.2; }
    .card .price { font-weight:700; color:#222; margin-bottom:6px; }
    .card p { font-size:12px; color:var(--muted); min-height:36px; margin:0 0 8px; }
    .card a { display:inline-block; padding:8px 10px; background:var(--accent); color:#fff; border-radius:4px; text-decoration:none; font-size:13px; }
    .admin { margin-top:18px; display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .btn { padding:8px 10px; border-radius:6px; border:1px solid var(--border); background:#fff; cursor:pointer; }
    .muted { color:var(--muted); font-size:13px; }
    .status-badge { position: fixed; right: 12px; bottom: 12px; padding:6px 10px; background: rgba(0,0,0,0.75); color:#fff; font-size:12px; border-radius:6px; z-index:9999; }
    @media (max-width:600px) { .card { width: calc(50% - 12px); } }
    @media (max-width:420px) { .card { width: 100%; } }
  </style>
</head>

    <div>

      <div class="muted">Central de Ofertas</div>
    </div>
  </header>

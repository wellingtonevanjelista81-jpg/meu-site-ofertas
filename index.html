<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Central de Ofertas</title>
  <meta name="description" content="Descontos atualizados nas maiores lojas do Brasil.">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style> body{font-family:'DM Sans',sans-serif} .card-offer{transition:all .25s}</style>
</head>
<body class="bg-gray-50 min-h-screen">

  <!-- Nav -->
  <nav class="bg-white shadow-sm sticky top-0 z-40">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="text-2xl font-bold text-orange-600">OfertasVip</div>
      <div>
        <button id="admin-toggle" class="p-2 rounded bg-gray-100 hover:bg-gray-200">
          <i data-lucide="user-cog"></i>
        </button>
      </div>
    </div>
  </nav>

  <!-- Hero -->
  <header class="py-12 text-center">
    <h1 class="text-3xl md:text-5xl font-extrabold">Central de Ofertas</h1>
    <p class="text-gray-600 mt-2">As melhores promoções atualizadas automaticamente.</p>
  </header>

  <!-- Ofertas -->
  <main class="max-w-6xl mx-auto px-4 pb-16">
    <section id="offers-section" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6"></section>
    <div id="empty" class="text-center text-gray-400 py-16 hidden">Nenhuma oferta encontrada.</div>

    <!-- VIP buttons -->
    <section class="mt-12 text-center">
      <div class="flex justify-center gap-4">
        <a id="btn-wa" href="#" target="_blank" class="px-6 py-3 bg-green-500 text-white rounded-xl inline-flex items-center gap-2">
          <i data-lucide="message-circle"></i> WhatsApp
        </a>
        <a id="btn-tg" href="#" target="_blank" class="px-6 py-3 bg-blue-600 text-white rounded-xl inline-flex items-center gap-2">
          <i data-lucide="send"></i> Telegram
        </a>
      </div>
    </section>
  </main>

  <!-- Admin modal -->
  <div id="admin-panel" class="fixed inset-0 bg-black/50 hidden items-start pt-16 pb-8">
    <div class="bg-white max-w-2xl mx-auto w-full rounded-xl shadow-xl p-6 overflow-y-auto max-h-[80vh]">
      <div class="flex justify-between items-center mb-4">
        <h2 class="font-bold text-lg">Painel Admin</h2>
        <button id="admin-close" class="p-2"><i data-lucide="x"></i></button>
      </div>

      <!-- Formulário de oferta -->
      <form id="offer-form" class="space-y-3">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
          <input id="f-name" placeholder="Nome do produto" class="p-3 border rounded" required>
          <input id="f-image" placeholder="URL da imagem" class="p-3 border rounded">
          <input id="f-original" placeholder="Preço original (ex: 199.90)" type="number" step="0.01" class="p-3 border rounded">
          <input id="f-promo" placeholder="Preço promocional (ex: 149.90)" type="number" step="0.01" class="p-3 border rounded">
        </div>
        <input id="f-link" placeholder="Link de afiliado" class="w-full p-3 border rounded" required>
        <div class="grid grid-cols-1 md:grid-cols-2 gap-2">
          <input id="f-wa-link" placeholder="Link do grupo WhatsApp" class="p-3 border rounded">
          <input id="f-tg-link" placeholder="Link do Telegram" class="p-3 border rounded">
        </div>

        <div class="flex gap-2">
          <button id="submit-btn" class="px-4 py-2 bg-orange-600 text-white rounded">Salvar (Local)</button>
          <button id="download-json" type="button" class="px-4 py-2 bg-gray-200 rounded">Exportar JSON</button>
          <button id="reset-local" type="button" class="px-4 py-2 bg-red-100 text-red-700 rounded">Limpar Local</button>
        </div>
      </form>

      <hr class="my-4">

      <div>
        <h4 class="font-semibold mb-2">Ofertas locais</h4>
        <div id="admin-list" class="space-y-2"></div>
      </div>
    </div>
  </div>

  <script>
    // CONFIG
    const REMOTE_JSON_PATH = '/data/offers.json'; // GitHub Pages serve arquivos estáticos do repo
    const LS_KEY = 'site_offers_v1';
    const LS_WA = 'site_wa_v1';
    const LS_TG = 'site_tg_v1';

    // STATE
    let offers = [];
    let waLink = localStorage.getItem(LS_WA) || '#';
    let tgLink = localStorage.getItem(LS_TG) || '#';

    // DOM refs
    const offersSection = document.getElementById('offers-section');
    const emptyEl = document.getElementById('empty');
    const btnWA = document.getElementById('btn-wa');
    const btnTG = document.getElementById('btn-tg');

    // Admin refs
    const adminPanel = document.getElementById('admin-panel');
    const adminToggle = document.getElementById('admin-toggle');
    const adminClose = document.getElementById('admin-close');
    const form = document.getElementById('offer-form');
    const fName = document.getElementById('f-name');
    const fImage = document.getElementById('f-image');
    const fOriginal = document.getElementById('f-original');
    const fPromo = document.getElementById('f-promo');
    const fLink = document.getElementById('f-link');
    const fWa = document.getElementById('f-wa-link');
    const fTg = document.getElementById('f-tg-link');
    const adminList = document.getElementById('admin-list');
    const downloadBtn = document.getElementById('download-json');
    const resetBtn = document.getElementById('reset-local');

    // UTIL: render a oferta UI
    function renderOffers() {
      offersSection.innerHTML = '';
      if (!offers || offers.length === 0) {
        emptyEl.classList.remove('hidden');
        return;
      }
      emptyEl.classList.add('hidden');
      offers.forEach(item => {
        const disc = item.original_price && item.promotional_price ? Math.round(((item.original_price - item.promotional_price)/item.original_price)*100) : 0;
        const card = document.createElement('article');
        card.className = 'card-offer bg-white rounded shadow p-4 flex flex-col';
        card.innerHTML = `
          <div class="h-40 flex items-center justify-center mb-3">
            <img src="${item.image_url || 'https://via.placeholder.com/250'}" alt="" class="max-h-full object-contain">
          </div>
          <h3 class="font-semibold text-sm mb-1">${escapeHtml(item.product_name)}</h3>
          <div class="text-xs text-gray-400 line-through">R$ ${formatPrice(item.original_price)}</div>
          <div class="text-lg font-bold text-orange-600">R$ ${formatPrice(item.promotional_price)}</div>
          <a href="${item.affiliate_link || '#'}" target="_blank" rel="noopener noreferrer" class="mt-3 inline-block text-center bg-black text-white py-2 rounded">Comprar</a>
        `;
        offersSection.appendChild(card);
      });
    }

    // helpers
    function formatPrice(v){ if(!v && v !== 0) return '0,00'; return Number(v).toFixed(2).replace('.',','); }
    function escapeHtml(s){ if(!s) return ''; return s.replace(/[&<>"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }

    // load remote / local
    async function loadRemoteOffers(){
      try{
        const res = await fetch(REMOTE_JSON_PATH, {cache: 'no-cache'});
        if(!res.ok) throw new Error('no remote');
        const data = await res.json();
        if(Array.isArray(data)) { offers = data; localStorage.setItem(LS_KEY, JSON.stringify(offers)); renderOffers(); return true; }
      }catch(e){
        // fallback to local
        const local = localStorage.getItem(LS_KEY);
        offers = local ? JSON.parse(local) : [];
        renderOffers();
        return false;
      }
    }

    // admin list
    function renderAdminList(){
      adminList.innerHTML = '';
      offers.forEach(o => {
        const div = document.createElement('div');
        div.className = 'flex items-center justify-between bg-gray-50 p-2 rounded text-sm';
        div.innerHTML = `<div class="truncate">${escapeHtml(o.product_name)}</div>
                         <div class="flex gap-2">
                           <button data-id="${o.id}" class="edit-btn text-blue-600">Editar</button>
                           <button data-id="${o.id}" class="del-btn text-red-600">Excluir</button>
                         </div>`;
        adminList.appendChild(div);
      });
      // attach actions
      adminList.querySelectorAll('.del-btn').forEach(b => b.addEventListener('click', e => {
        const id = e.currentTarget.dataset.id;
        if(confirm('Excluir oferta?')) { offers = offers.filter(x => String(x.id) !== String(id)); saveLocal(); renderAdminList(); renderOffers(); }
      }));
      adminList.querySelectorAll('.edit-btn').forEach(b => b.addEventListener('click', e => {
        const id = e.currentTarget.dataset.id;
        const item = offers.find(x => String(x.id) === String(id));
        if(!item) return;
        fName.value = item.product_name;
        fImage.value = item.image_url || '';
        fOriginal.value = item.original_price || '';
        fPromo.value = item.promotional_price || '';
        fLink.value = item.affiliate_link || '';
        // scroll to form
        window.scrollTo({top:0,behavior:'smooth'});
        // set editing marker
        form.dataset.editing = id;
      }));
    }

    // save local
    function saveLocal(){
      localStorage.setItem(LS_KEY, JSON.stringify(offers));
      localStorage.setItem(LS_WA, waLink);
      localStorage.setItem(LS_TG, tgLink);
    }

    // download JSON (for manual upload or debugging)
    downloadBtn.addEventListener('click', () => {
      const blob = new Blob([JSON.stringify(offers, null, 2)], {type:'application/json'});
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a'); a.href = url; a.download = 'offers.json'; document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    });

    resetBtn.addEventListener('click', () => { if(confirm('Limpar ofertas locais?')) { offers = []; waLink = '#'; tgLink = '#'; saveLocal(); renderOffers(); renderAdminList(); updateVipButtons(); } });

    // admin open/close
    adminToggle.addEventListener('click', () => {
      adminPanel.classList.remove('hidden'); fWa.value = waLink === '#' ? '' : waLink; fTg.value = tgLink === '#' ? '' : tgLink;
    });
    adminClose.addEventListener('click', () => { adminPanel.classList.add('hidden'); form.reset(); delete form.dataset.editing; });

    // form submit (local only)
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      waLink = fWa.value.trim() || '#';
      tgLink = fTg.value.trim() || '#';
      const id = form.dataset.editing ? Number(form.dataset.editing) : Date.now();
      const item = {
        id,
        product_name: fName.value.trim(),
        image_url: fImage.value.trim(),
        original_price: parseFloat(fOriginal.value) || 0,
        promotional_price: parseFloat(fPromo.value) || 0,
        affiliate_link: fLink.value.trim()
      };
      if(form.dataset.editing) offers = offers.map(o => o.id === id ? item : o);
      else offers.unshift(item);
      delete form.dataset.editing;
      form.reset();
      saveLocal();
      renderAdminList();
      renderOffers();
      updateVipButtons();
      alert('Salvo localmente. Para publicar globalmente, configure o n8n para atualizar /data/offers.json (veja instruções).');
    });

    function updateVipButtons(){ btnWA.href = waLink || '#'; btnTG.href = tgLink || '#'; }

    // initial load
    (async function init(){
      // first try remote
      await loadRemoteOffers();
      // then load group links from localStorage (if admin saved)
      waLink = localStorage.getItem(LS_WA) || waLink;
      tgLink = localStorage.getItem(LS_TG) || tgLink;
      updateVipButtons();
      renderAdminList();
      lucide.createIcons();
    })();

  </script>
<!-- Script para carregar ofertas do GitHub para o site automaticamente -->
<script>
async function carregarOfertasDoGithub() {
    try {
        const response = await fetch('/data/offers.json', { cache: 'no-cache' });
        if (response.ok) {
            const ofertasNovas = await response.json();
            // Salva no LocalStorage para o site ler
            localStorage.setItem('offers', JSON.stringify(ofertasNovas));
            console.log('Ofertas atualizadas do GitHub com sucesso!');
            
            // Se a página estiver vazia, recarrega para mostrar os produtos
            if (document.body.innerText.includes("Nenhuma oferta encontrada")) {
                location.reload();
            }
        }
    } catch (erro) {
        console.error('Erro ao buscar ofertas:', erro);
    }
}
// Executa o carregamento assim que a página abre
carregarOfertasDoGithub();
</script> </body>
</html>

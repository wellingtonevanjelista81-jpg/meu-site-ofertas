<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Via Mais Store! — Central de Ofertas</title>
  <meta name="description" content="Ofertas e descontos atualizados automaticamente." />
  <style>
    :root{
      --ml-yellow: #ffe600;
      --ml-yellow-dark: #f5d400;
      --vip-gold: #d4af37; /* dourado */
      --bg:#f6f7fb; --card:#fff; --muted:#5b6168;
      --btn-blue: #007bff; --btn-blue-dark:#0069d9;
      --wa:#25D366; --tg:#0088CC;
      --price-black: #111111; --old-price:#9ca3af; --card-radius:10px;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;background:var(--bg);color:#111;-webkit-font-smoothing:antialiased}
    /* Top bar: logo left, search center, store name right */
    .topbar{
      background:var(--ml-yellow);
      border-bottom:3px solid var(--ml-yellow-dark);
      padding:10px 18px;
      position:sticky;
      top:0;
      z-index:95;
      display:flex;
      align-items:center;
      gap:14px;
      justify-content:space-between;
    }
    .top-left{display:flex;align-items:center;gap:12px;min-width:0}
    .logo img{height:44px;display:block}
    .search-wrap{flex:1;display:flex;justify-content:center;padding:0 12px;min-width:200px}
    .searchbar{width:100%;max-width:920px;display:flex;align-items:center;gap:8px}
    .searchbar input{flex:1;padding:12px;border-radius:8px;border:1px solid rgba(0,0,0,0.08);min-width:0}
    .searchbar button{padding:10px 14px;border-radius:8px;border:none;background:#222;color:#fff;cursor:pointer}
    .store-name{font-weight:900;font-size:18px;color:#000;margin-left:12px;white-space:nowrap}

    /* black strip below yellow for VIP */
    .vip-black{background:#000;color:#fff;padding:10px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .vip-left{display:flex;align-items:center;gap:12px}
    .vip-title{font-weight:800; display:inline-block; background:var(--vip-gold); color:#000; padding:6px 12px; border-radius:8px}
    .vip-desc{opacity:0.95;color:#fff;margin-left:8px}
    .vip-actions{display:flex;gap:8px;align-items:center}
    .vip-actions a{padding:8px 12px;border-radius:8px;color:#fff;text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:8px}
    .vip-actions .wa{background:var(--wa);color:#fff}
    .vip-actions .tg{background:var(--tg);color:#fff}

    /* layout main */
    .container{max-width:1280px;margin:18px auto;padding:0 18px 80px}
    .hero-banner{background:#fff;border-radius:10px;padding:18px;margin-bottom:12px;border:1px solid #eee;display:flex;align-items:center;justify-content:space-between}
    .hero-left{display:flex;flex-direction:column}
    .hero-left h1{margin:0;font-size:20px}
    .hero-left p{margin:4px 0 0;color:var(--muted)}

    /* Grid responsive */
    .offers-grid{
      display:grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap:16px;
    }

    .card{background:var(--card);border-radius:10px;overflow:hidden;border:1px solid #e9edf2;display:flex;flex-direction:column;height:100%}
    .media{aspect-ratio: 4 / 3;background:#fafafa;display:flex;align-items:center;justify-content:center;padding:12px;}
    .media img{width:100%;height:100%;object-fit:contain;display:block}
    .body{padding:12px;flex:1;display:flex;flex-direction:column}
    .title{font-size:14px;font-weight:600;color:#111;min-height:44px;margin-bottom:6px}
    .shop{font-size:12px;color:var(--muted);margin-bottom:8px}
    .price-row{display:flex;align-items:flex-end;gap:8px;justify-content:space-between;margin-top:auto}
    .price {font-weight:800;color:var(--price-black);font-size:18px}
    .old-price{color:var(--old-price);text-decoration:line-through;font-size:13px}
    .buy{display:inline-block;padding:10px 12px;border-radius:10px;background:var(--btn-blue);color:#fff;text-decoration:none;text-align:center;font-weight:700;border:none}
    .buy:hover{background:var(--btn-blue-dark)}
    .pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:18px}
    .pager button{padding:8px 10px;border-radius:8px;border:1px solid #e6e8ef;background:#fff;cursor:pointer}
    .admin-panel{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);align-items:center;justify-content:center;padding:20px;z-index:120}
    .admin-panel .card{width:820px;max-width:100%}
    .admin-panel.active{display:flex}
    .btn-ghost{background:#fff;border:1px solid #e6e8ef;padding:8px 10px;border-radius:8px;cursor:pointer}
    .gear-btn{position:fixed;left:12px;bottom:12px;background:#fff;border-radius:999px;padding:10px;border:1px solid #e6e8ef;box-shadow:0 6px 18px rgba(0,0,0,0.06);cursor:pointer;z-index:100}
    .small{font-size:13px;color:var(--muted)}

    /* Mobile tweaks */
    @media (max-width:780px){
      .searchbar input{padding:10px}
      .hero-banner{flex-direction:column;align-items:flex-start;gap:8px}
      .store-name{font-size:16px}
    }
    @media (max-width:520px){
      .topbar{padding:8px}
      .title{font-size:13px}
      .price{font-size:16px}
      .vip-actions a{padding:8px}
      .searchbar button{padding:8px}
      .store-name{display:none} /* simplify small screens */
    }
  </style>
</head>
<body>
  <div class="topbar" role="banner">
    <div class="top-left">
      <div class="logo" aria-hidden="true">
        <!-- Primeiro tenta /assets/logo.png (coloque seu arquivo em assets/logo.png).
             Se não existir, usa SVG inline como fallback. -->
        <img id="site-logo" src="assets/logo.png"
             onerror="this.onerror=null; this.src='data:image/svg+xml;utf8,<svg xmlns=&quot;http://www.w3.org/2000/svg&quot; width=&quot;180&quot; height=&quot;44&quot;><rect width=&quot;100%&quot; height=&quot;100%&quot; fill=&quot;%23ffe600&quot;/><text x=&quot;14&quot; y=&quot;28&quot; font-family=&quot;Arial&quot; font-size=&quot;16&quot; fill=&quot;%23000&quot;>Via Mais Store</text></svg>'"
             alt="Via Mais Store Logo">
      </div>
    </div>

    <div class="search-wrap" role="search" aria-label="Busca">
      <div class="searchbar">
        <input id="q" placeholder="Buscar produtos, marcas e muito mais..." />
        <button id="btn-search">Buscar</button>
      </div>
    </div>

    <div class="top-right" style="display:flex;align-items:center;gap:12px;">
      <div class="store-name" aria-hidden="true">VIA MAIS STORE</div>
    </div>
  </div>

  <div class="vip-black" role="region" aria-label="Grupo VIP">
    <div class="vip-left">
      <div class="vip-title">GRUPO VIP</div>
      <div class="vip-desc">Entre no nosso Grupo Vip! Receba ofertas exclusivas.</div>
    </div>
    <div class="vip-actions">
      <a id="vip-wa" class="wa" href="#" target="_blank" rel="noopener noreferrer">WhatsApp</a>
      <a id="vip-tg" class="tg" href="#" target="_blank" rel="noopener noreferrer">Telegram</a>
    </div>
  </div>

  <div class="container">
    <div class="hero-banner" role="region" aria-label="Ofertas do Dia">
      <div class="hero-left">
        <h1>Ofertas do Dia</h1>
        <p>Confira os melhores descontos selecionados.</p>
      </div>
      <div>
        <button id="open-admin" class="btn-ghost">Abrir Admin</button>
      </div>
    </div>

    <main class="content" id="main-content">
      <div id="offers-list" class="offers-grid" aria-live="polite"></div>
      <div id="empty" class="small" style="text-align:center;padding:36px;display:none">Nenhuma oferta encontrada.</div>
      <div class="pager" id="pager"></div>
    </main>
  </div>

  <!-- ADMIN PANEL (mantido) -->
  <div id="admin-panel" class="admin-panel" aria-hidden="true">
    <div class="card" style="max-height:84vh;overflow:auto;position:relative;padding:16px;">
      <button id="close-admin" class="btn-ghost" style="position:absolute;top:12px;right:12px">Fechar</button>
      <h3>Painel Admin</h3>
      <div style="margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div>
          <div class="small">Links de grupo (WhatsApp / Telegram)</div>
          <input id="f-wa-link" placeholder="Link do WhatsApp" style="margin-top:6px;padding:8px" />
          <input id="f-tg-link" placeholder="Link do Telegram" style="margin-top:6px;padding:8px" />
          <div style="margin-top:8px"><button id="btn-save-links" class="btn-ghost">Salvar Links</button></div>
        </div>

        <div>
          <div class="small">Importar / Exportar</div>
          <div style="margin-top:6px;display:flex;gap:8px">
            <button id="btn-export" class="btn-ghost">Exportar ofertas (JSON)</button>
            <button id="btn-import" class="btn-ghost">Importar JSON</button>
            <input id="file-import" type="file" accept="application/json" style="display:none" />
          </div>
          <div style="margin-top:12px" class="small">Fonte: <span id="last-updated">—</span></div>
        </div>
      </div>

      <hr style="margin:12px 0">

      <div>
        <div class="small">Adicionar oferta manual</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px">
          <input id="f-name" placeholder="Nome do produto" />
          <input id="f-category" placeholder="Categoria (ex: Eletrônicos)" />
          <input id="f-price" placeholder="Preço (ex: 199.90)" />
          <input id="f-promotional" placeholder="Promocional (opcional)" />
          <input id="f-link" placeholder="Link de afiliado" style="grid-column:1/3" />
          <input id="f-image" placeholder="URL da imagem (opcional)" style="grid-column:1/3" />
          <label style="grid-column:1/3;display:flex;align-items:center;gap:8px"><input id="f-featured" type="checkbox"/> Destacar</label>
        </div>
        <div style="margin-top:10px;display:flex;gap:8px;">
          <button id="btn-save-product" class="btn-ghost">Salvar Produto</button>
          <button id="btn-clear-local" class="btn-ghost">Limpar ofertas locais</button>
        </div>
      </div>
    </div>
  </div>

  <button id="gear" class="gear-btn" aria-label="Abrir painel administrativo">⚙</button>

  <script>
  // CONFIG (mantive a lógica já testada)
  const REMOTE_JSON_PATH = '/data/offers.json';
  const ADMIN_HASH = 'f69f04a9c340f2c80896c5adbfe0686369ac3ed9935af596879207ab4cc511c3';
  const PLACEHOLDER = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600"><rect fill="#f3f4f6" width="100%" height="100%"/><text x="50%" y="54%" font-family="Arial" font-size="28" fill="#9ca3af" text-anchor="middle">Imagem indisponível</text></svg>'
  );

  // UTILITIES
  function sanitize(s){ return (s===undefined || s===null) ? '' : String(s).replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function formatBR(value){ return Number(value || 0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2}); }
  function toNumber(v){
    if(v === undefined || v === null) return 0;
    let s = String(v).trim();
    s = s.replace(/[^\d\.,-]/g,'').trim();
    if(!s) return 0;
    if(s.indexOf(',') > -1 && s.indexOf('.') > -1){ s = s.replace(/\./g,''); s = s.replace(/,/g,'.'); }
    else if(s.indexOf(',') > -1 && s.indexOf('.') === -1){ s = s.replace(/,/g,'.'); }
    const n = parseFloat(s);
    return isNaN(n) ? 0 : Math.round((n + Number.EPSILON) * 100) / 100;
  }
  function normalizeUrl(u){ if(!u) return '#'; u = String(u).trim(); if(u === '#' || u === '' || u === 'https://#') return '#'; if(/^[a-zA-Z][a-zA-Z0-9+\-.]*:\/\//.test(u)) return u; return 'https://' + u; }
  function showToast(msg){ let t = document.getElementById('__toast'); if(!t){ t = document.createElement('div'); t.id = '__toast'; Object.assign(t.style, {position:'fixed',left:'50%',transform:'translateX(-50%)',bottom:'20px',background:'#222',color:'#fff',padding:'12px',borderRadius:'8px',zIndex:10000}); document.body.appendChild(t); } t.textContent = msg; t.style.display='block'; setTimeout(()=>t.style.display='none', 3000); }
  async function sha256Hex(text){ const enc = new TextEncoder().encode(text); const hash = await crypto.subtle.digest('SHA-256', enc); return [...new Uint8Array(hash)].map(b => b.toString(16).padStart(2,'0')).join(''); }

  // VIP handlers (sem o botão "Participar")
  function applyVipHandlers(){
    const a1 = document.getElementById('vip-wa');
    const a2 = document.getElementById('vip-tg');
    const rawWa = (localStorage.getItem('site_wa') || '#').trim();
    const rawTg = (localStorage.getItem('site_tg') || '#').trim();
    const wa = normalizeUrl(rawWa);
    const tg = normalizeUrl(rawTg);
    if(a1){ a1.href = wa; a1.onclick = e => { e.preventDefault(); window.open(wa,'_blank'); } }
    if(a2){ a2.href = tg; a2.onclick = e => { e.preventDefault(); window.open(tg,'_blank'); } }
  }

  // Data handling & rendering (mantido — sem alterações)
  async function fetchRemoteOffers(){
    try{
      const r = await fetch(REMOTE_JSON_PATH + '?t=' + Date.now(), {cache:'no-store'});
      if(!r.ok) throw new Error('remote not ok');
      const data = await r.json();
      const arr = Array.isArray(data) ? data : (data.offers || []);
      return arr.map(normalizeOffer);
    }catch(e){ console.warn('remote fetch failed', e); return null; }
  }
  function normalizeOffer(o){
    return {
      id: o.id || ('local_'+(Date.now()+Math.floor(Math.random()*9999))),
      title: sanitize(o.title || o.name || ''),
      category: sanitize(o.category || (o.tags && o.tags[0]) || 'Geral'),
      price: toNumber(o.price || o.price_raw || o.price_value || 0),
      promotional_price: (o.promotional_price !== undefined && o.promotional_price !== null) ? toNumber(o.promotional_price) : null,
      image_url: o.image_url || o.image || o.img || PLACEHOLDER,
      link: normalizeUrl(o.link || o.affiliate_link || '#'),
      featured: !!o.featured,
      created_at: o.created_at || (new Date().toISOString())
    };
  }
  function loadLocalOffers(){ try{ const raw = localStorage.getItem('offers'); if(!raw) return []; const parsed = JSON.parse(raw); if(!Array.isArray(parsed)) return []; return parsed.map(normalizeOffer); }catch(e){ console.warn('local parse fail', e); return []; } }
  function saveLocalOffers(arr){ localStorage.setItem('offers', JSON.stringify(arr)); }

  let ALL_OFFERS = []; let FILTERED = []; let state = { q:'', category:'', sort:'relevance', page:1, pageSize:12 };

  function applyFilters(){
    const q = state.q.trim().toLowerCase();
    FILTERED = ALL_OFFERS.filter(o => {
      if(q){
        return (o.title && o.title.toLowerCase().includes(q)) || (o.category && o.category.toLowerCase().includes(q));
      }
      return true;
    });
    applySort();
  }
  function applySort(){
    switch(state.sort){
      case 'price-asc': FILTERED.sort((a,b)=> (a.promotional_price || a.price) - (b.promotional_price || b.price)); break;
      case 'price-desc': FILTERED.sort((a,b)=> (b.promotional_price || b.price) - (a.promotional_price || a.price)); break;
      case 'discount': FILTERED.sort((a,b)=> { const da = (a.price && a.promotional_price) ? ((a.price - a.promotional_price)/a.price) : 0; const db = (b.price && b.promotional_price) ? ((b.price - b.promotional_price)/b.price) : 0; return db - da; }); break;
      case 'newest': FILTERED.sort((a,b)=> new Date(b.created_at) - new Date(a.created_at)); break;
      default: break;
    }
    renderPage();
  }

  function renderPage(){
    const cont = document.getElementById('offers-list');
    const empty = document.getElementById('empty');
    const pageSize = parseInt(state.pageSize,10) || 12;
    const total = FILTERED.length;
    const pages = Math.max(1, Math.ceil(total / pageSize));
    if(state.page > pages) state.page = pages;
    const start = (state.page - 1) * pageSize;
    const slice = FILTERED.slice(start, start + pageSize);

    cont.innerHTML = '';
    if(slice.length === 0){ empty.style.display = 'block'; } else { empty.style.display = 'none'; }

    slice.forEach(o => {
      const card = document.createElement('div'); card.className = 'card';
      const promo = o.promotional_price && o.promotional_price < o.price;
      const displayed = (promo ? o.promotional_price : o.price) || 0;
      const old = promo ? o.price : null;

      card.innerHTML = `
        <div class="media"><img src="${sanitize(o.image_url)}" alt="${sanitize(o.title)}"></div>
        <div class="body">
          <div class="title">${sanitize(o.title)}</div>
          <div class="shop small">${sanitize(o.category)}</div>
          <div style="display:flex;gap:8px;align-items:center;margin-top:auto">
            <div>
              <div class="price">R$ ${formatBR(displayed)}</div>
              ${old ? `<div class="old-price">R$ ${formatBR(old)}</div>` : ''}
            </div>
            <div style="margin-left:auto;display:flex;flex-direction:column;gap:8px;align-items:flex-end">
              <a class="buy" href="${sanitize(o.link)}" target="_blank" rel="noopener noreferrer">Ver oferta</a>
              <button class="btn-ghost" data-id="${o.id}" style="font-size:12px">Salvar</button>
            </div>
          </div>
        </div>
      `;
      cont.appendChild(card);

      const imgEl = card.querySelector('img');
      if(imgEl){
        imgEl.addEventListener('error', function handleError(){
          try{
            if(this.src && this.src.indexOf('http://') === 0){
              const httpsSrc = this.src.replace(/^http:\/\//i,'https://');
              if(httpsSrc !== this.src){ this.onerror = null; this.src = httpsSrc; setTimeout(()=>{ this.addEventListener('error', handleError, {once:true}); }, 800); return; }
            }
          }catch(e){}
          this.onerror = null; this.src = PLACEHOLDER;
        }, {once:true});
        if(!imgEl.src) imgEl.src = PLACEHOLDER;
      }

      const btn = card.querySelector('.btn-ghost[data-id]');
      btn.addEventListener('click', ()=> {
        const favs = JSON.parse(localStorage.getItem('favs') || '[]');
        if(!favs.includes(o.id)){ favs.push(o.id); localStorage.setItem('favs', JSON.stringify(favs)); showToast('Salvo nos favoritos'); }
        else { showToast('Já salvo'); }
      });
    });

    renderPager(pages, total);
  }

  function renderPager(pages, total){
    const pager = document.getElementById('pager'); pager.innerHTML = '';
    const info = document.createElement('div'); info.textContent = `${total} resultado(s)`; pager.appendChild(info);

    const prev = document.createElement('button'); prev.textContent = '« Anterior'; prev.disabled = state.page <= 1; prev.addEventListener('click', ()=> { state.page--; renderPage(); }); pager.appendChild(prev);

    const start = Math.max(1, state.page - 3); const end = Math.min(pages, start + 6);
    for(let i=start;i<=end;i++){ const b = document.createElement('button'); b.textContent = i; b.style.fontWeight = (i===state.page) ? '700' : '400'; b.addEventListener('click', ()=> { state.page = i; renderPage(); }); pager.appendChild(b); }

    const next = document.createElement('button'); next.textContent = 'Próximo »'; next.disabled = state.page >= pages; next.addEventListener('click', ()=> { state.page++; renderPage(); }); pager.appendChild(next);
  }

  // Load sequence + admin handlers (mantidos)
  async function loadOffers(){
    document.getElementById('last-updated').textContent = 'Carregando...';
    const remote = await fetchRemoteOffers();
    const local = loadLocalOffers();
    if(remote && remote.length){
      ALL_OFFERS = remote;
      document.getElementById('last-updated').textContent = 'Remoto';
      const localsOnly = local.filter(l => String(l.id).startsWith('local_'));
      if(localsOnly.length) ALL_OFFERS = ALL_OFFERS.concat(localsOnly);
    } else if(local && local.length){
      ALL_OFFERS = local;
      document.getElementById('last-updated').textContent = 'Local';
    } else { ALL_OFFERS = []; document.getElementById('last-updated').textContent = '—'; }
    saveLocalOffers(ALL_OFFERS);
    applyFilters();
  }

  async function openAdmin(){
    const pwd = prompt('Senha:');
    if(!pwd) return;
    const h = await sha256Hex(pwd);
    if(h !== ADMIN_HASH){ alert('Senha incorreta'); return; }
    document.getElementById('admin-panel').classList.add('active');
    document.getElementById('admin-panel').setAttribute('aria-hidden','false');
    document.getElementById('f-wa-link').value = localStorage.getItem('site_wa') || '';
    document.getElementById('f-tg-link').value = localStorage.getItem('site_tg') || '';
  }
  function closeAdmin(){ document.getElementById('admin-panel').classList.remove('active'); document.getElementById('admin-panel').setAttribute('aria-hidden','true'); }

  document.getElementById('gear').addEventListener('click', ()=> openAdmin());
  document.getElementById('close-admin').addEventListener('click', ()=> closeAdmin());
  document.getElementById('open-admin').addEventListener('click', ()=> openAdmin());

  document.getElementById('btn-save-links').onclick = ()=> {
    const wa = normalizeUrl(document.getElementById('f-wa-link').value);
    const tg = normalizeUrl(document.getElementById('f-tg-link').value);
    localStorage.setItem('site_wa', wa);
    localStorage.setItem('site_tg', tg);
    applyVipHandlers();
    alert('Links salvos!');
  };

  document.getElementById('btn-save-product')?.addEventListener('click', ()=> {
    const t = document.getElementById('f-name').value.trim();
    if(!t){ alert('Informe nome'); return; }
    const cat = document.getElementById('f-category').value.trim() || 'Geral';
    const price = toNumber(document.getElementById('f-price').value || 0);
    const promo = document.getElementById('f-promotional').value ? toNumber(document.getElementById('f-promotional').value) : null;
    const link = normalizeUrl(document.getElementById('f-link').value || '#');
    const image = document.getElementById('f-image').value.trim();
    const featured = document.getElementById('f-featured').checked;
    const item = normalizeOffer({
      id: 'local_' + (Date.now() + Math.floor(Math.random()*9999)),
      title: t,
      category: cat,
      price: price,
      promotional_price: promo,
      link: link,
      image_url: image || PLACEHOLDER,
      featured: featured,
      created_at: new Date().toISOString()
    });
    ALL_OFFERS.unshift(item);
    saveLocalOffers(ALL_OFFERS);
    applyFilters();
    showToast('Oferta adicionada');
  });

  document.getElementById('btn-clear-local').onclick = ()=> {
    if(!confirm('Remover todas as ofertas locais? (não remove o remoto)')) return;
    fetchRemoteOffers().then(remote=>{
      if(remote && remote.length){ ALL_OFFERS = remote; document.getElementById('last-updated').textContent = 'Remoto'; }
      else { ALL_OFFERS = []; document.getElementById('last-updated').textContent = '—'; }
      saveLocalOffers(ALL_OFFERS);
      applyFilters();
      showToast('Ofertas locais removidas');
    });
  };

  // Import/Export bindings
  document.getElementById('btn-export').addEventListener('click', ()=>{
    const data = JSON.stringify(ALL_OFFERS, null, 2);
    const blob = new Blob([data], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = 'offers.json'; a.click(); URL.revokeObjectURL(url);
  });
  document.getElementById('btn-import').addEventListener('click', ()=> document.getElementById('file-import').click());
  document.getElementById('file-import').addEventListener('change', function(){
    const f = this.files[0]; if(!f) return;
    const reader = new FileReader();
    reader.onload = (ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!Array.isArray(parsed)) throw new Error('Formato inválido');
        const normalized = parsed.map(normalizeOffer);
        ALL_OFFERS = normalized.concat(ALL_OFFERS);
        saveLocalOffers(ALL_OFFERS);
        applyFilters();
        showToast('Importação concluída');
      }catch(e){ alert('Erro ao importar JSON: ' + (e.message || e)); }
    };
    reader.readAsText(f); this.value = '';
  });

  // Search binding
  document.getElementById('q').addEventListener('input', (e)=>{ state.q = e.target.value; state.page = 1; applyFilters(); });
  document.getElementById('btn-search').addEventListener('click', ()=> { state.q = document.getElementById('q').value; state.page = 1; applyFilters(); });

  applyVipHandlers();
  loadOffers();
  window.addEventListener('storage', ()=> applyVipHandlers());
  </script>
</body>
</html>
